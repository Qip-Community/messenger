<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QIP Messenger 2026</title>
  <meta name="description" content="Классический QIP Messenger на современный лад.">
  
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="firebase-config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>

  <!-- ===== Экран входа / регистрации QIP ===== -->
  <div id="auth-screen">
    <div id="auth-box">
      <div class="qip-window-header">
        <span class="qip-icon">🌼</span>
        <span class="qip-title">QIP Messenger — Авторизация</span>
      </div>

      <div class="auth-content">
        <div id="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-tab="login" role="tab">Вход</button>
          <button type="button" class="auth-tab" data-tab="register" role="tab">Регистрация</button>
        </div>

        <form id="login-form" class="auth-form">
          <label>Email / UIN:</label>
          <input type="email" placeholder="user@domain.com" autocomplete="email" required id="login-email">
          <label>Пароль:</label>
          <input type="password" placeholder="••••••••" autocomplete="current-password" required id="login-password">
          <button type="submit" class="qip-btn">Войти в сеть</button>
          <p class="auth-error" id="login-error" aria-live="polite"></p>
        </form>

        <form id="register-form" class="auth-form" style="display:none">
          <label>Никнейм:</label>
          <input type="text" placeholder="Ваш ник" autocomplete="nickname" required id="register-name" maxlength="30">
          <label>Email:</label>
          <input type="email" placeholder="user@domain.com" autocomplete="email" required id="register-email">
          <label>Пароль (мин. 6 символов):</label>
          <input type="password" placeholder="••••••••" autocomplete="new-password" required id="register-password" minlength="6">
          <button type="submit" class="qip-btn">Зарегистрировать UIN</button>
          <p class="auth-error" id="register-error" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== Главный интерфейс QIP ===== -->
  <div id="app" style="display:none">

    <aside id="contacts-panel">
      <!-- Главная шапка QIP -->
      <div id="qip-main-header">
        <div class="qip-logo">
          <span class="flower-icon">🌼</span>
          <span class="qip-brand">QIP Messenger</span>
        </div>
        <div class="window-controls">
          <button type="button" id="edit-profile-btn" title="Настройки профиля">⚙</button>
          <button type="button" id="logout-btn" title="Отключиться">✖</button>
        </div>
      </div>

      <!-- Статус бар владельца -->
      <div id="own-status-bar">
        <div id="own-avatar-wrapper" title="Сменить аватар">
          <img id="own-avatar-img" src="" alt="Аватар" style="display:none;">
          <div id="own-avatar-placeholder">Я</div>
        </div>
        <div id="own-info">
          <div id="own-name">—</div>
          <select id="status-select" aria-label="Смена статуса">
            <option value="online">🟢 В сети (Online)</option>
            <option value="away">🟡 Отошел (Away)</option>
            <option value="dnd">🔴 Не беспокоить (DND)</option>
            <option value="offline">⚪ Не в сети (Offline)</option>
          </select>
        </div>
      </div>

      <!-- Поиск и Добавление -->
      <div id="search-row">
        <input type="text" id="search-input" placeholder="Поиск контактов..." aria-label="Поиск">
        <button type="button" id="add-friend-btn" title="Добавить контакт">+ Добавить</button>
      </div>

      <!-- Список контактов -->
      <div id="friend-requests-list"></div>
      <div id="contacts-list"></div>

      <!-- Нижняя статусная строка QIP -->
      <div id="qip-bottom-bar">
        <span class="qip-status-text">Готов к работе</span>
        <button type="button" id="sound-toggle-btn" class="active" title="Звуки QIP">🔊</button>
      </div>
    </aside>

    <!-- Основная зона чата QIP -->
    <main id="chat-area">
      <div id="tabs-row"></div>
      <div id="chats-container"></div>
      <div id="empty-state">
        <div class="qip-welcome">
          <span class="big-flower">🌼</span>
          <h3>QIP Messenger 2026</h3>
          <p>Выберите контакт из списка слева для начала общения.</p>
        </div>
      </div>
    </main>

  </div>

  <!-- Модальное окно: Мой профиль -->
  <div id="profile-edit-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="qip-window-header">
        <span>Настройки личных данных</span>
        <button type="button" class="close-x" id="close-profile-edit-btn">✕</button>
      </div>
      <form id="profile-edit-form" class="modal-body">
        <div class="avatar-preview-box">
          <img id="edit-avatar-preview" src="" alt="Превью" style="display:none;">
          <div id="edit-avatar-placeholder">?</div>
        </div>
        
        <label>URL аватара:</label>
        <input type="url" id="edit-avatar-url" placeholder="https://domain.com/avatar.jpg">

        <label>Никнейм / Имя:</label>
        <input type="text" id="edit-display-name" maxlength="30" required>

        <label>Статус-сообщение (X-Status / Bio):</label>
        <textarea id="edit-bio" maxlength="120" rows="3" placeholder="Что у вас нового?"></textarea>

        <div class="modal-actions">
          <button type="submit" class="qip-btn">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модальное окно: Просмотр профиля контакта -->
  <div id="user-profile-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card profile-view-card">
      <div class="qip-window-header">
        <span>Информация о контакте</span>
        <button type="button" class="close-x" id="close-user-profile-btn">✕</button>
      </div>
      
      <div class="modal-body profile-header">
        <img id="view-user-avatar" src="" alt="Аватар" style="display:none;">
        <div id="view-user-avatar-placeholder" class="large-placeholder">?</div>
        <h3 id="view-user-name">Пользователь</h3>
        <span id="view-user-status" class="status-badge">Не в сети</span>

        <div class="profile-info-group">
          <span class="info-label">Email / UIN:</span>
          <span id="view-user-email" class="info-value">—</span>
        </div>
        <div class="profile-info-group">
          <span class="info-label">X-Status:</span>
          <p id="view-user-bio" class="info-value bio-text">Статус отсутствует.</p>
        </div>

        <div class="modal-actions">
          <button type="button" id="start-chat-from-profile-btn" class="qip-btn">Отправить сообщение</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
